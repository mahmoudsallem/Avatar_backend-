version: 0.2
# Builds the Docker image (python:3.11-slim-bookworm + CUDA torch 2.11/cu130 + the full ML stack -
# this is the slow, GPU-dependency-heavy build CLAUDE.md notes can take hours locally; CodeBuild
# with privileged mode + a large compute type does it in the cloud instead) and pushes it to ECR,
# tagged with the short commit SHA (never just "latest" - later pipeline stages need a stable,
# specific tag to canary-test and then promote).
phases:
  pre_build:
    commands:
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --storage-driver=overlay2 &
      - timeout 30 sh -c "until docker info >/dev/null 2>&1; do sleep 1; done"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - IMAGE_TAG="$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-12)"
      - echo "Building commit $IMAGE_TAG"
      - echo "IMAGE_TAG=$IMAGE_TAG" > image_tag.env
  build:
    commands:
      - docker build -t $ECR_REGISTRY/avatar:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/avatar:$IMAGE_TAG
artifacts:
  files:
    - image_tag.env
